<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayers Loan Application</title>
<link rel="icon" href="applicationform/assets/ayers-logo.svg">
<!-- The form lives at /applicationform. The path is relative on purpose, so this
     works both at aiersq.com.au/ and under a project path such as
     haohuilu.com/ayersapplicationform/ — an old bookmark still lands on the form. -->
<meta http-equiv="refresh" content="0; url=./applicationform/">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; background: #fff;
         font: 14px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         color: #58585b; }
  .box { text-align: center; padding: 24px; }
  img { width: 132px; height: auto; margin-bottom: 18px; }
  a { color: #ee4b23; font-weight: 700; }
</style>
</head>
<body>
  <div class="box">
    <img src="applicationform/assets/ayers-logo.svg" alt="Ayers">
    <p>Taking you to the loan application&hellip;</p>
    <p><a href="./applicationform/">Open the loan application</a></p>
  </div>
  <script>location.replace('./applicationform/');</script>
</body>
</html>
